submission:
  title: "Power Outage Prediction & Grid Equipment Failure Advisor"

  problem_statement: >
    Power transformer and substation failures cause blackouts costing utilities
    $1M+/hour and affecting millions of people. Most utilities still use
    calendar-based maintenance schedules, while sensors already measuring
    temperature, vibration, partial discharge, and oil quality show failure
    signatures weeks in advance. Weather events compound the risk — but sensor
    data and weather forecasts are never combined in time to act.

  solution_summary: >
    We built an IBM Bob-powered real-time grid equipment failure advisor that
    combines live sensor telemetry from 25 Gujarat grid assets, district-level
    weather forecasts, and historical incident records into an explainable
    weighted risk score for every asset. IBM Bob (watsonx.ai Granite model)
    generates a prioritised maintenance and crew pre-positioning dispatch plan,
    ranks assets by grid impact severity (customers at risk × criticality ×
    failure probability), and answers free-text operational questions from
    control-room operators in plain language.

  key_features:
    - "Real-time multi-signal risk scoring: 6-factor weighted model combining oil quality, vibration, temperature, load factor, weather forecast, and incident history — all weights named, documented, and sum-enforced"
    - "IBM Bob (watsonx.ai ibm/granite-13b-instruct-v2) generates the prioritised maintenance and crew dispatch plan and explains each asset risk in plain language via the /ask and /plan endpoints"
    - "Live WebSocket dashboard pushing sensor updates every 5 seconds for 25 Gujarat grid assets across 15 districts with anomaly injection (overheating, high vibration, partial discharge, overload)"
    - "District-level risk aggregation, crew pre-positioning recommendations with geographic adjacency routing, and dynamic alert engine with threshold-crossing and rapid-increase detection"
    - "Fully operational without live credentials — deterministic mock fallback keeps the entire pipeline running for demo reliability; switching to real IBM Bob requires only three environment variables"

  tech_stack:
    languages: ["Python", "JavaScript", "CSS"]
    frameworks: ["FastAPI", "React", "Vite"]
    ibm_technologies: ["IBM Bob", "watsonx.ai", "ibm/granite-13b-instruct-v2"]
    databases: []
    other: ["Leaflet.js", "WebSocket", "uvicorn", "python-dotenv"]

  what_we_are_most_proud_of: >
    The explainability layer: every risk score is a documented weighted sum of
    named factors (not a black box), every contributing factor is surfaced to
    the operator with its raw value and contribution weight, and IBM Bob
    translates the machine score into plain-language reasoning a grid operations
    manager can act on immediately. The full pipeline — 25 live assets, weather
    simulation across 15 districts, alert engine, crew planner, and Bob-powered
    dispatch plan — runs end-to-end without any external dependencies, making
    the demo completely reliable.

  known_limitations: >
    Sensor and weather data are synthetically simulated for the demo rather
    than pulled from live SCADA/IoT feeds or a real weather API; the pipeline
    is structured for a real data source to be swapped in without changing any
    model or API layer. IBM Bob integration runs in a local mock-reasoning mode
    by default when credentials are not set, switching automatically to real
    watsonx.ai calls when IBM_BOB_API_KEY and WATSONX_PROJECT_ID are provided.

